info:
  name: Get Realm Role by Name
  type: http
  seq: 1

http:
  method: GET
  url: "{{keycloak_url}}/admin/realms/{{realm}}/roles/{{role_name}}"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
