info:
  name: Assign Client Role to User
  type: http
  seq: 4

http:
  method: POST
  url: "{{keycloak_url}}/admin/realms/{{realm}}/users/{{user_id}}/role-mappings/clients/{{client_id}}"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      [
        {
          "id": "{{role_id}}",
          "name": "{{role_name}}"
        }
      ]
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
