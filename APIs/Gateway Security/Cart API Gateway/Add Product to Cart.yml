info:
  name: Add Product to Cart
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/cart
  headers:
    - name: X-User-ID
      value: 6af0dfffad6035061343aa8d
  body:
    type: json
    data: "{\r

      \    \"productId\": \"1\",\r

      \    \"quantity\": 2\r

      }"
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: http://localhost:8443/realms/ecom-app/protocol/openid-connect/auth
    accessTokenUrl: http://localhost:8443/realms/ecom-app/protocol/openid-connect/token
    callbackUrl: http://localhost:5173
    credentials:
      clientId: oauth2-pkce
      placement: basic_auth_header
    pkce: {}
    tokenConfig:
      id: oauth-test
      placement:
        header: Bearer
      source: access_token

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
