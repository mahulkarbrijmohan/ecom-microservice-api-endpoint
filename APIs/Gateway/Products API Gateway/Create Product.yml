info:
  name: Create Product
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/products
  body:
    type: json
    data: "{\r

      \    \"name\": \"iPhone 15 Pro\",\r

      \    \"description\": \"Latest iPhone with amazing features\",\r

      \    \"price\": 1099.99,\r

      \    \"stockQuantity\": 50,\r

      \    \"category\": \"Electronics\",\r

      \    \"imageUrl\": \"https://placehold.co/600x400\"\r

      }\r\n"
  auth:
    type: oauth2
    flow: client_credentials
    credentials:
      placement: basic_auth_header
    tokenConfig:
      placement:
        header: Bearer
      source: access_token

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
