info:
  name: Create Product
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/products
  body:
    type: json
    data: "{\r

      \    \"name\": \"iPhone 16 Pro\",\r

      \    \"description\": \"Latest iPhone with amazing features\",\r

      \    \"price\": 1099.99,\r

      \    \"stockQuantity\": 50,\r

      \    \"category\": \"Electronics\",\r

      \    \"imageUrl\": \"https://placehold.co/600x400\"\r

      }\r\n"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
